name: flexivault

# Coolify-specific compose file.
#
# The normal docker-compose.yml publishes a host port for a VPS or a home
# server. Coolify's proxy reaches this container over the internal Docker
# network, so this file exposes 8787 instead of binding it to the host.
#
# In Coolify, create a Docker Compose resource with:
#   Docker Compose Location: /docker-compose.coolify.yml
#   Base Directory:          /
#   Domain:                  https://vault.example.com -> port 8787
#
# Coolify injects SERVICE_FQDN_SERVER_8787 when a domain is configured.

services:
  server:
    # Published by .github/workflows/release.yml and server-image.yml. Pin
    # FLEXIVAULT_IMAGE_TAG to a release tag (for example v1.0.0) for reproducible
    # deployments, to latest for the newest release, or to edge for main.
    image: ghcr.io/scshiv29-dev/flexivault-server:${FLEXIVAULT_IMAGE_TAG:-latest}
    # To build from this checkout instead of pulling the published image,
    # comment out the image line above and uncomment this block:
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      SERVER_NAME: ${SERVER_NAME:-FlexiVault}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-2592000}
      MAX_VAULT_BYTES: ${MAX_VAULT_BYTES:-8388608}
      MAX_ITEMS: ${MAX_ITEMS:-5000}
      # Coolify terminates TLS in front of the container. Trust its proxy
      # headers so rate limiting uses the real client address.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Empty values make the server generate and persist secrets in /data.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-}
      # Set by Coolify when a domain is assigned to port 8787. Leave the
      # host-side default empty; Coolify injects the real value on deploy.
      SERVICE_FQDN_SERVER_8787: ${SERVICE_FQDN_SERVER_8787:-}
    volumes:
      - flexivault-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flexivault-data:
