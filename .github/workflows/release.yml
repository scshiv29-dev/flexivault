name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check the mobile app
        run: npx tsc --noEmit

      - name: Run mobile tests
        run: npx jest --runInBand

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Check and test the browser extension
        working-directory: extension
        run: |
          npm run check
          npm test

  android:
    name: Build the Android APK
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Check the tag matches app.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${VERSION}."
            exit 1
          fi

      - name: Require signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Tagged releases need ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
          exit 1

      - name: Materialize the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/flexivault-release.jks
          chmod 600 android/keystore/flexivault-release.jks
          {
            printf 'storeFile=keystore/flexivault-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect the APK and checksum
        id: package
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="FlexiVault-${GITHUB_REF_NAME#v}"
          else
            NAME="FlexiVault-${VERSION}-${GITHUB_SHA::7}"
          fi

          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          if [[ ! -f "$APK" ]]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"
          (
            cd dist
            sha256sum "${NAME}.apk" > "${NAME}.apk.sha256"
          )

          if [[ "${ANDROID_KEYSTORE_BASE64}" != "" ]]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            if [[ -n "$APKSIGNER" ]]; then
              "$APKSIGNER" verify --verbose "dist/${NAME}.apk"
            fi
          fi

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexivault-release-apk
          path: dist/
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "FlexiVault ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

  extension:
    name: Package the browser extension
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Package the extension zip
        id: package
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="FlexiVault-Extension-${VERSION}"
          else
            NAME="FlexiVault-Extension-${VERSION}-${GITHUB_SHA::7}"
          fi

          mkdir -p dist
          (
            cd extension
            zip -r "../dist/${NAME}.zip" \
              manifest.json \
              background.js \
              content.js \
              popup.html \
              popup.css \
              popup.js \
              vault.html \
              unlock.html \
              unlock.css \
              unlock.js \
              src \
              fonts \
              icons
          )

          (
            cd dist
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
            unzip -l "${NAME}.zip"
          )

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexivault-extension
          path: dist/
          if-no-files-found: error

      - name: Publish the extension to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  server-image:
    name: Publish the server image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/flexivault-server
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
